apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-lab
  template:
    metadata:
      labels:
        app: react-lab
    spec:
      containers:
        - name: react
          image: react-lab:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: react-lab
spec:
  type: NodePort
  selector:
    app: react-lab
  ports:
    - port: 80
      targetPort: 80
